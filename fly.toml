app = "standard-works-semantic-search"
primary_region = "lax"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine running at all times so there are no cold starts
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
